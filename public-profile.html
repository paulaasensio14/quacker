<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="color-scheme"
    content="light dark"
  >

  <title>Perfil · Quacker</title>

  <link
    rel="icon"
    type="image/png"
    href="/assets/img/logo-quacker.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/assets/css/base.css"
  >

  <link
    rel="stylesheet"
    href="/assets/css/public-profile.css"
  >
</head>

<body>
  <div class="public-profile-shell">

    <header class="public-profile-topbar">
      <a
        class="public-profile-brand"
        href="/"
        aria-label="Quacker · Inicio"
      >
        <img
          src="/assets/img/logo-quacker.png"
          alt=""
          width="42"
          height="42"
        >

        <span>Quacker</span>
      </a>
    </header>

    <main class="public-profile-main">

      <section
        id="publicProfileLoading"
        class="public-profile-state"
        aria-live="polite"
      >
        <p>Cargando perfil…</p>
      </section>

      <section
        id="publicProfileError"
        class="public-profile-state"
        role="alert"
        hidden
      >
        <h1>No hemos podido cargar este perfil</h1>

        <p>
          Inténtalo de nuevo dentro de unos instantes.
        </p>

        <a href="/">
          Volver a Quacker
        </a>
      </section>

      <div
        id="publicProfileContent"
        hidden
      >
        <section
          class="public-profile-hero"
          aria-labelledby="publicProfileName"
        >
          <div class="public-profile-avatar-wrap">
            <img
              id="publicProfileAvatar"
              class="public-profile-avatar"
              src="/assets/img/logo-quacker.png"
              alt=""
              width="132"
              height="132"
            >
          </div>

          <div class="public-profile-identity">
            <p class="public-profile-kicker">
              Perfil de Quacker
            </p>

            <h1 id="publicProfileName"></h1>

            <p
              id="publicProfileUsername"
              class="public-profile-username"
            ></p>

            <p
              id="publicProfileBio"
              class="public-profile-bio"
            ></p>

            <div
              id="publicProfileSocial"
              class="public-profile-social"
              hidden
            >
              <button
                id="publicProfileSocialAction"
                class="public-profile-social-action"
                type="button"
              ></button>

              <p
                id="publicProfileAccessNote"
                class="public-profile-access-note"
                aria-live="polite"
              ></p>
            </div>
          </div>
        </section>

        <section
          id="publicProfileFavorites"
          class="public-profile-favorites"
          aria-labelledby="publicProfileFavoritesTitle"
          hidden
        >
          <div class="public-profile-section-heading">
            <div>
              <p class="public-profile-kicker">
                Sus imprescindibles
              </p>

              <h2 id="publicProfileFavoritesTitle">
                Favoritos
              </h2>
            </div>
          </div>

          <div
            id="publicProfileFavoritesTabs"
            class="public-profile-favorites-tabs"
            role="tablist"
            aria-label="Categorías de favoritos"
          >
            <button
              id="publicProfileFavoritesTab-pelicula"
              class="public-profile-favorites-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="publicProfileFavoritesPanel"
              tabindex="0"
              data-favorites-tab="pelicula"
            >
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M4 8h16v11H4z"></path>
                <path d="M4 8l2-4h14l-2 4"></path>
                <path d="M9 4L7 8"></path>
                <path d="M15 4l-2 4"></path>
              </svg>
              <span>Películas</span>
            </button>

            <button
              id="publicProfileFavoritesTab-serie"
              class="public-profile-favorites-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="publicProfileFavoritesPanel"
              tabindex="-1"
              data-favorites-tab="serie"
            >
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2"
                ></rect>
                <path d="M8 9h8"></path>
                <path d="M8 13h5"></path>
              </svg>
              <span>Series</span>
            </button>

            <button
              id="publicProfileFavoritesTab-game"
              class="public-profile-favorites-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="publicProfileFavoritesPanel"
              tabindex="-1"
              data-favorites-tab="game"
            >
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M8 9h8a5 5 0 0 1 4.5 7.2l-.7 1.4a2.4 2.4 0 0 1-3.5.9l-2.1-1.4a4 4 0 0 0-4.4 0l-2.1 1.4a2.4 2.4 0 0 1-3.5-.9l-.7-1.4A5 5 0 0 1 8 9z"
                ></path>
                <path d="M8 12v4"></path>
                <path d="M6 14h4"></path>
                <circle cx="16" cy="13" r="0.8"></circle>
                <circle cx="18" cy="15" r="0.8"></circle>
              </svg>
              <span>Juegos</span>
            </button>

            <button
              id="publicProfileFavoritesTab-book"
              class="public-profile-favorites-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="publicProfileFavoritesPanel"
              tabindex="-1"
              data-favorites-tab="book"
            >
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M3.5 5.5A4 4 0 0 1 7.5 4H12v16H7.5a4 4 0 0 0-4 1.5z"
                ></path>
                <path
                  d="M20.5 5.5A4 4 0 0 0 16.5 4H12v16h4.5a4 4 0 0 1 4 1.5z"
                ></path>
              </svg>
              <span>Libros</span>
            </button>
          </div>

          <div
            id="publicProfileFavoritesPanel"
            class="public-profile-favorites-panel"
            role="tabpanel"
            aria-labelledby="publicProfileFavoritesTab-pelicula"
          >
            <div
              id="publicProfileFavoritesGrid"
              class="public-profile-favorites-grid"
            ></div>
          </div>
        </section>
        <section
          id="publicProfileStats"
          class="public-profile-section public-profile-stats"
          aria-labelledby="publicProfileStatsTitle"
          hidden
        >
          <div class="public-profile-section-heading">
            <div>
              <p class="public-profile-kicker">
                Su recorrido
              </p>
              <h2 id="publicProfileStatsTitle">
                Estadísticas
              </h2>
            </div>
          </div>

          <div
            id="publicProfileStatsGrid"
            class="public-profile-stats-grid"
          ></div>
        </section>

        <section
          id="publicProfileLists"
          class="public-profile-section public-profile-lists"
          aria-labelledby="publicProfileListsTitle"
          hidden
        >
          <div class="public-profile-section-heading">
            <div>
              <p class="public-profile-kicker">
                Sus colecciones
              </p>
              <h2 id="publicProfileListsTitle">
                Listas públicas
              </h2>
            </div>
          </div>

          <div
            id="publicProfileListsGrid"
            class="public-profile-lists-grid"
          ></div>
        </section>

        <section
          id="publicProfileReviews"
          class="public-profile-section public-profile-reviews"
          aria-labelledby="publicProfileReviewsTitle"
          hidden
        >
          <div class="public-profile-section-heading">
            <div>
              <p class="public-profile-kicker">
                Lo que piensa
              </p>
              <h2 id="publicProfileReviewsTitle">
                Reseñas
              </h2>
            </div>
          </div>

          <div
            id="publicProfileReviewsList"
            class="public-profile-reviews-list"
          ></div>
        </section>

        <section
          id="publicProfileActivity"
          class="public-profile-section public-profile-activity"
          aria-labelledby="publicProfileActivityTitle"
          hidden
        >
          <div class="public-profile-section-heading">
            <div>
              <p class="public-profile-kicker">
                Últimos movimientos
              </p>
              <h2 id="publicProfileActivityTitle">
                Actividad
              </h2>
            </div>
          </div>

          <div
            id="publicProfileActivityList"
            class="public-profile-activity-list"
          ></div>
        </section>

      </div>

    </main>
  </div>

  <script
    src="/assets/js/app/public-profile.js"
    defer
  ></script>
</body>
</html>
